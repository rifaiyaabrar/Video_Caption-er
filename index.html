<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Video Captioner</title>
<style>
  :root {
    --bg: #0f1115; --panel: #181b22; --line: #2a2f3a;
    --text: #e8eaf0; --muted: #8a91a0; --accent: #4f8cff; --active: #1f2a44;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
         background: var(--bg); color: var(--text); }
  header { height: 60px; padding: 0 24px; border-bottom: 1px solid var(--line);
           display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  h1 { font-size: 18px; margin: 0; }
  #status { font-size: 13px; color: var(--muted); margin-left: auto; }
  button { background: var(--accent); color: #fff; border: 0; border-radius: 8px;
           padding: 8px 14px; cursor: pointer; font: inherit; font-size: 14px; }
  .hidden { display: none !important; }

  /* Upload view */
  #uploadView { display: grid; place-items: center; height: calc(100vh - 60px); padding: 16px; }
  #drop { width: min(520px, 100%); padding: 56px 24px; border: 2px dashed var(--line);
          border-radius: 14px; text-align: center; cursor: pointer; background: var(--panel); }
  #drop.over { border-color: var(--accent); }
  .uploadBox { width: min(520px, 100%); display: flex; flex-direction: column; gap: 16px; }
  .modelPick { display: flex; flex-direction: column; gap: 6px; }
  .modelPick span { font-size: 13px; color: var(--muted); font-weight: 600;
                    text-transform: uppercase; letter-spacing: .04em; }
  .modelPick select { padding: 10px 12px; font-size: 15px; }
  .modelPick small { color: var(--muted); font-size: 13px; }
  #modelBadge { font-size: 13px; color: var(--muted); }
  #modelBadge b { color: var(--text); font-weight: 600; }
  #drop strong { font-size: 18px; }
  #drop p { color: var(--muted); margin: 8px 0 0; }

  /* Player view */
  #playerView { display: grid; grid-template-columns: 3fr 2fr; gap: 20px;
                padding: 20px 24px; height: calc(100vh - 60px); }
  .left { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  video { width: 100%; max-height: 68vh; background: #000; border-radius: 10px; }
  #nowCaption { min-height: 76px; padding: 14px 18px; background: var(--panel);
                border: 1px solid var(--line); border-radius: 10px; font-size: 20px; line-height: 1.4; }
  #nowCaption.waiting { color: var(--muted); font-size: 15px; }
  .right { display: flex; flex-direction: column; background: var(--panel);
           border: 1px solid var(--line); border-radius: 10px; min-height: 0; }
  .panelHead { display: flex; align-items: center; gap: 8px; padding: 8px 12px 8px 16px;
               border-bottom: 1px solid var(--line); }
  .right h2 { font-size: 13px; margin: 0; color: var(--muted); font-weight: 600;
              text-transform: uppercase; letter-spacing: .04em; margin-right: auto; }
  select { background: var(--bg); color: var(--text); border: 1px solid var(--line);
           border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 13px; }
  .small { padding: 6px 12px; font-size: 13px; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  #list { overflow-y: auto; padding: 8px; flex: 1; }
  .seg { display: flex; gap: 12px; padding: 10px; border-radius: 8px; cursor: pointer; line-height: 1.4; }
  .seg:hover { background: #20242d; }
  .seg.active { background: var(--active); }
  .seg time { font-variant-numeric: tabular-nums; color: var(--accent); font-size: 13px;
              white-space: nowrap; padding-top: 2px; }
  #typing { color: var(--muted); padding: 10px; font-size: 13px; }
  .error { color: #ff6b6b; padding: 10px; font-size: 13px; }

  @media (max-width: 800px) {
    #playerView { grid-template-columns: 1fr; height: auto; }
    .right { max-height: 50vh; }
  }
</style>
</head>
<body>
<header>
  <h1>Video Captioner</h1>
  <span id="status"></span>
  <button id="newBtn" class="hidden" onclick="location.reload()">New video</button>
</header>

<!-- Step 1: upload -->
<section id="uploadView">
  <div class="uploadBox">
  <label class="modelPick">
    <span>Gemini model</span>
    <select id="modelSelect">
      <option value="auto">Auto (fallback): loading…</option>
    </select>
    <small id="modelHint">Auto tries the main model, then switches to a backup if it's busy.</small>
  </label>
  <div id="drop">
    <strong>Drop a video here</strong>
    <p>or click to choose a file (mp4, mov, webm…)</p>
    <input id="fileInput" type="file" accept="video/*" hidden>
  </div>
  </div>
</section>

<!-- Step 2: video + captions side by side -->
<section id="playerView" class="hidden">
  <div class="left">
    <video id="video" controls></video>
    <div id="nowCaption" class="waiting">Waiting for captions…</div>
    <div id="modelBadge"></div>
  </div>
  <div class="right">
    <div class="panelHead">
      <h2>Captions</h2>
      <select id="exportFormat" title="Export format">
        <option value="srt">SRT (.srt)</option>
        <option value="vtt">WebVTT (.vtt)</option>
        <option value="txt">Text (.txt)</option>
        <option value="json">JSON (.json)</option>
      </select>
      <button id="exportBtn" class="small" disabled>Export</button>
    </div>
    <div id="list">
      <div id="typing">Uploading video to Gemini…</div>
    </div>
  </div>
</section>

<script>
const $ = id => document.getElementById(id);
const segments = [];
let activeIdx = -1;
let generating = true;
let lastNowText = null;
let videoBaseName = 'captions';
let modeLabel = 'auto';

// ---------- Model dropdown ----------
const pretty = m => m.replace(/^gemini-/, 'Gemini ').replace(/-/g, ' ')
                     .replace(/\b(flash|lite|argon|pro)\b/g, w => w[0].toUpperCase() + w.slice(1));

fetch('/models').then(r => r.json()).then(({ auto_chain, models }) => {
  const sel = $('modelSelect');
  sel.innerHTML = '';
  const auto = new Option(`Auto (fallback): ${auto_chain.map(pretty).join(' → ')}`, 'auto');
  sel.add(auto);
  const group = document.createElement('optgroup');
  group.label = 'Strict: use only this model';
  models.forEach(m => group.append(new Option(pretty(m), 'strict:' + m)));
  sel.append(group);
  try { const saved = localStorage.getItem('captionModel'); if (saved && [...sel.options].some(o => o.value === saved)) sel.value = saved; } catch {}
  updateHint();
}).catch(() => { $('modelHint').textContent = 'Could not load model list; Auto will be used.'; });

function updateHint() {
  const v = $('modelSelect').value;
  $('modelHint').textContent = v === 'auto'
    ? "Auto tries the main model, then switches to a backup if it's busy."
    : `Strict: only ${pretty(v.slice(7))} is used. If it's busy you get an error instead of a backup.`;
}
$('modelSelect').onchange = () => {
  updateHint();
  try { localStorage.setItem('captionModel', $('modelSelect').value); } catch {}
};

// ---------- Upload UI ----------
const drop = $('drop');
drop.onclick = () => $('fileInput').click();
drop.ondragover = e => { e.preventDefault(); drop.classList.add('over'); };
drop.ondragleave = () => drop.classList.remove('over');
drop.ondrop = e => {
  e.preventDefault(); drop.classList.remove('over');
  if (e.dataTransfer.files[0]) start(e.dataTransfer.files[0]);
};
$('fileInput').onchange = e => e.target.files[0] && start(e.target.files[0]);

function setStatus(t) { $('status').textContent = t; }
function setTyping(t) { $('typing').textContent = t; }

async function start(file) {
  if (!file.type.startsWith('video/')) { alert('Please choose a video file.'); return; }
  videoBaseName = file.name.replace(/\.[^.]+$/, '') || 'captions';

  // Switch to the player page and play the video straight from the browser
  $('uploadView').classList.add('hidden');
  $('playerView').classList.remove('hidden');
  $('newBtn').classList.remove('hidden');
  $('video').src = URL.createObjectURL(file);
  requestAnimationFrame(sync);

  let fileName;
  try {
    fileName = await upload(file);
  } catch (err) {
    showError('Upload failed: ' + err.message);
    return;
  }
  await streamCaptions(fileName);
}

function upload(file) {
  return new Promise((resolve, reject) => {
    const xhr = new XMLHttpRequest();
    const fd = new FormData();
    fd.append('video', file);
    xhr.open('POST', '/upload');
    xhr.upload.onprogress = e => {
      if (!e.lengthComputable) return;
      const p = Math.round(e.loaded / e.total * 100);
      const msg = p < 100 ? `Uploading ${p}%` : 'Gemini is processing the video…';
      setStatus(msg); setTyping(msg);
    };
    xhr.onload = () => {
      let data = {};
      try { data = JSON.parse(xhr.responseText); } catch {}
      if (xhr.status === 200 && data.file_name) resolve(data.file_name);
      else reject(new Error(data.error || xhr.statusText));
    };
    xhr.onerror = () => reject(new Error('Network error'));
    xhr.send(fd);
  });
}

// ---------- Streaming captions ----------
async function streamCaptions(fileName) {
  setStatus('Generating captions…');
  setTyping('Gemini is writing captions…');

  const choice = $('modelSelect').value;
  const params = new URLSearchParams({ file: fileName });
  if (choice === 'auto') params.set('mode', 'auto');
  else { params.set('mode', 'strict'); params.set('model', choice.slice(7)); }
  modeLabel = choice === 'auto' ? 'auto' : 'strict';
  $('modelBadge').innerHTML = `Model: <b>${choice === 'auto' ? 'Auto' : pretty(choice.slice(7))}</b> (${modeLabel})`;

  const res = await fetch('/captions?' + params);
  if (!res.ok) {
    let msg = res.statusText;
    try { msg = (await res.json()).error || msg; } catch {}
    showError('ERROR: ' + msg);
    $('typing').remove();
    return;
  }
  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';

  while (true) {
    const { value, done } = await reader.read();
    if (done) break;
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\n');
    buffer = lines.pop();            // keep the incomplete last line
    lines.forEach(handleLine);
  }
  if (buffer.trim()) handleLine(buffer);

  generating = false;
  $('typing').remove();
  if (!document.querySelector('.error')) setStatus(`Done: ${segments.length} captions`);
}

// "00:05-00:09 | A man opens the door"  (also accepts H:MM:SS and decimals)
const TS = '(?:\\d{1,2}:)?\\d{1,2}:\\d{2}(?:\\.\\d+)?';
const LINE_RE = new RegExp(`^\\s*\\[?(${TS})\\s*[-–]\\s*(${TS})\\]?\\s*[|:]?\\s*(.+)$`);
const toSec = s => s.split(':').map(Number).reduce((a, b) => a * 60 + b, 0);

function handleLine(line) {
  if (line.startsWith('ERROR')) { showError(line); return; }
  if (line.startsWith('MODEL: ')) {
    const m = line.slice(7).trim();
    $('modelBadge').innerHTML = `Model: <b>${pretty(m)}</b> (${modeLabel})`;
    setStatus(`Generating captions with ${pretty(m)}…`);
    return;
  }
  if (line.startsWith('BUSY: ')) {
    const m = line.slice(6).trim();
    const msg = `${pretty(m)} is busy, retrying…`;
    setStatus(msg); setTyping(msg);
    return;
  }
  const m = line.match(LINE_RE);
  if (!m) return;                    // ignore anything that isn't a caption line

  const seg = { start: toSec(m[1]), end: toSec(m[2]), text: m[3].trim() };
  if (seg.end <= seg.start) seg.end = seg.start + 1;
  segments.push(seg);

  const idx = segments.length - 1;
  const row = document.createElement('div');
  row.className = 'seg';
  row.id = 'seg-' + idx;
  const time = document.createElement('time');
  time.textContent = `${m[1]}–${m[2]}`;
  const text = document.createElement('span');
  text.textContent = seg.text;
  row.append(time, text);
  row.onclick = () => { $('video').currentTime = seg.start; $('video').play(); };
  $('list').insertBefore(row, $('typing'));
  $('exportBtn').disabled = false;
}

// ---------- Export ----------
const pad = (n, w = 2) => String(Math.floor(n)).padStart(w, '0');
function stamp(sec, msSep) {          // 65.5 -> "00:01:05,500" (SRT) / "00:01:05.500" (VTT)
  const ms = Math.round(sec * 1000);
  return `${pad(ms / 3600000)}:${pad(ms / 60000 % 60)}:${pad(ms / 1000 % 60)}${msSep}${pad(ms % 1000, 3)}`;
}
function short(sec) {                  // 65 -> "01:05" (or "1:01:05")
  const s = Math.round(sec), h = Math.floor(s / 3600);
  return (h ? h + ':' : '') + pad(s / 60 % 60) + ':' + pad(s % 60);
}

function buildExport(fmt) {
  switch (fmt) {
    case 'srt':
      return segments.map((s, i) =>
        `${i + 1}\n${stamp(s.start, ',')} --> ${stamp(s.end, ',')}\n${s.text}\n`).join('\n');
    case 'vtt':
      return 'WEBVTT\n\n' + segments.map(s =>
        `${stamp(s.start, '.')} --> ${stamp(s.end, '.')}\n${s.text}\n`).join('\n');
    case 'txt':
      return segments.map(s => `[${short(s.start)} - ${short(s.end)}] ${s.text}`).join('\n') + '\n';
    case 'json':
      return JSON.stringify(segments.map(s => ({ start: s.start, end: s.end, text: s.text })), null, 2);
  }
}

$('exportBtn').onclick = () => {
  if (!segments.length) return;
  const fmt = $('exportFormat').value;
  const mime = { srt: 'application/x-subrip', vtt: 'text/vtt', txt: 'text/plain', json: 'application/json' }[fmt];
  const blob = new Blob([buildExport(fmt)], { type: mime + ';charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${videoBaseName}.${fmt}`;
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  if (generating) setStatus('Exported captions so far (still generating)');
};

function showError(msg) {
  const el = document.createElement('div');
  el.className = 'error';
  el.textContent = msg;
  $('list').append(el);
  setStatus('Error');
  generating = false;
}

// ---------- Keep captions in sync with the video ----------
function sync() {
  const t = $('video').currentTime;
  const idx = segments.findIndex(s => t >= s.start && t < s.end);

  if (idx !== activeIdx) {
    if (activeIdx >= 0) $('seg-' + activeIdx)?.classList.remove('active');
    if (idx >= 0) {
      const row = $('seg-' + idx);
      row.classList.add('active');
      row.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
    }
    activeIdx = idx;
  }

  let nowText, waiting;
  if (idx >= 0) { nowText = segments[idx].text; waiting = false; }
  else if (generating) { nowText = 'Caption for this moment is still being generated…'; waiting = true; }
  else { nowText = ''; waiting = false; }

  if (nowText !== lastNowText) {
    $('nowCaption').textContent = nowText;
    $('nowCaption').classList.toggle('waiting', waiting);
    lastNowText = nowText;
  }
  requestAnimationFrame(sync);
}
</script>
</body>
</html>
